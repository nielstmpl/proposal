<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Halaman 09 - Penawaran Sponsorship</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #fff;
    color: #111;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    background: #fff;
    page-break-after: avoid;
    page-break-inside: avoid;
  }

  .bar-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 13mm;
    background: #C8102E;
    display: flex;
    align-items: center;
    padding: 0 10mm;
    z-index: 2;
  }
  .bar-top span {
    font-size: 3.4mm;
    font-weight: 700;
    letter-spacing: 0.4mm;
    color: #fff;
    text-transform: uppercase;
  }

  .content {
    position: absolute;
    top: 13mm;
    bottom: 0;
    left: 0; right: 0;
    padding: 4mm 8mm 6mm;
    display: flex;
    flex-direction: column;
    gap: 3mm;
  }

  .page-head h1 {
    font-family: 'Playfair Display', serif;
    font-size: 7mm;
    font-weight: 800;
    color: #111;
    padding-left: 4mm;
    border-left: 1.5mm solid #C8102E;
    line-height: 1.1;
    margin-bottom: 1mm;
  }
  .page-head .sub {
    font-size: 3.5mm;
    font-weight: 500;
    font-style: italic;
    color: #666;
    padding-left: 5.5mm;
    margin-bottom: 2mm;
  }

  .intro {
    font-size: 3.2mm;
    line-height: 1.55;
    text-align: justify;
    color: #333;
    padding: 0 1mm;
  }

  .sec-bar {
    background: #C8102E;
    color: #fff;
    font-size: 3.2mm;
    font-weight: 800;
    letter-spacing: 0.3mm;
    text-transform: uppercase;
    padding: 2.2mm 4mm;
  }

  /* ── Partisipasi grid ── */
  .part-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3mm;
  }

  .part-box {
    border: 0.4mm solid #C8102E;
    padding: 3mm 3.5mm 3.5mm;
    position: relative;
    min-height: 22mm;
  }
  .part-box .letter {
    display: inline-block;
    background: #C8102E;
    color: #fff;
    font-size: 3.2mm;
    font-weight: 800;
    width: 6mm;
    height: 6mm;
    line-height: 6mm;
    text-align: center;
    margin-bottom: 2mm;
  }
  .part-box h3 {
    font-size: 3.3mm;
    font-weight: 800;
    color: #C8102E;
    letter-spacing: 0.2mm;
    text-transform: uppercase;
    margin-bottom: 1.5mm;
    line-height: 1.25;
  }
  .part-box p {
    font-size: 3.1mm;
    line-height: 1.45;
    color: #333;
    text-align: justify;
  }

  /* ── Benefits ── */
  .benefits {
    flex: 1;
    min-height: 0;
  }
  .benefits ol {
    margin: 0;
    padding: 2.5mm 4mm 2.5mm 10mm;
    border: 0.3mm solid #e8e8e8;
    border-top: none;
  }
  .benefits ol li {
    font-size: 3.15mm;
    line-height: 1.5;
    text-align: justify;
    margin-bottom: 1.8mm;
    padding-left: 1mm;
  }
  .benefits ol li:last-child { margin-bottom: 0; }
  .benefits ol li::marker {
    color: #C8102E;
    font-weight: 800;
  }
  .benefits ol li strong {
    font-weight: 700;
    color: #111;
  }

  /* ── Kontak ── */
  .kontak {
    background: #f7f7f7;
    border-left: 1.5mm solid #C8102E;
    padding: 3.5mm 4mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4mm;
    flex-shrink: 0;
  }
  .kontak-head {
    grid-column: 1 / -1;
    font-size: 3.4mm;
    font-weight: 800;
    color: #C8102E;
    text-transform: uppercase;
    letter-spacing: 0.3mm;
    margin-bottom: -1mm;
  }
  .kontak-item .name {
    font-size: 3.3mm;
    font-weight: 800;
    color: #111;
    margin-bottom: 0.5mm;
  }
  .kontak-item .role {
    font-size: 3mm;
    font-weight: 500;
    color: #555;
    margin-bottom: 1.5mm;
  }
  .kontak-item .phone {
    font-size: 3.1mm;
    font-weight: 600;
    color: #C8102E;
    display: flex;
    align-items: center;
    gap: 1.5mm;
  }
  .kontak-item .phone .wa {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 5mm;
    height: 5mm;
    background: #25D366;
    color: #fff;
    border-radius: 50%;
    font-size: 2.8mm;
    font-weight: 800;
    flex-shrink: 0;
  }

  @media screen {
    body {
      margin: 8mm auto;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
    }
  }

  @media print {
    html, body { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="bar-top">
    <span id="hal9-bar">Halaman 09</span>
  </div>

  <div class="content">

    <div class="page-head">
      <h1 id="hal9-title">Halaman 09</h1>
      <div class="sub" id="hal9-subtitle"></div>
    </div>

    <p class="intro" id="hal9-intro"></p>

    <div>
      <div class="sec-bar" id="hal9-part-title">Informasi</div>
      <div class="part-grid" id="hal9-part-grid" style="margin-top:3mm;"></div>
    </div>

    <div class="benefits">
      <div class="sec-bar" id="hal9-benefits-title">Informasi</div>
      <ol id="hal9-benefits"></ol>
    </div>

    <div class="kontak">
      <div class="kontak-head">Kontak Panitia</div>
      <div class="kontak-item">
        <div class="name" data-cfg="panitia.ketua.nama">Panny Aryanto Wibowo</div>
        <div class="role" data-cfg="panitia.ketua.jabatan">Ketua Panitia HUT RI ke-81 RW 16</div>
        <div class="phone"><span class="wa">W</span> <span data-cfg="panitia.ketua.wa">+62 838-2263-9123</span></div>
      </div>
      <div class="kontak-item">
        <div class="name" data-cfg="panitia.ketuaRw.nama">Agus Kusnadi</div>
        <div class="role" data-cfg="panitia.ketuaRw.jabatan">Ketua RW 16</div>
        <div class="phone"><span class="wa">W</span> <span data-cfg="panitia.ketuaRw.wa">+62 859-5666-3233</span></div>
      </div>
    </div>

  </div>

</div>
<script src="boot-config.js"></script>
<script src="apply-config.js"></script>
</body>
</html>
